name: Feature request
description: Propose a focused improvement to Avatar.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Data and rights considerations
      description: Note any source text, model, privacy, or licensing implications.
