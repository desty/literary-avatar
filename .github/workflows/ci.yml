name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[ui,dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Audit Python dependencies
        run: pip-audit --local --skip-editable
      - name: Check installed CLI
        run: |
          avatar --version
          avatar-prepare --help
      - name: Compile
        run: python -m compileall -q src app.py demo.py scripts tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline smoke check
        env:
          AVATAR_GENERATION_BACKEND: mock
        run: python scripts/smoke_check.py --assets-only
      - name: Verify prepared-asset provenance
        run: python scripts/check_provenance.py
      - name: Verify licensing metadata
        run: reuse lint
      - name: Build distribution
        run: python -m build
